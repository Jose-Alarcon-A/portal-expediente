<div class="contenedor">
  <h1>Portal de Expedientes Electrónicos</h1>
  <h2>Bandeja de Trabajo</h2>

  <div class="card">
    <div class="formulario-grid">

      <input type="text" placeholder="Nombre del expediente"
        [(ngModel)]="nuevoExpediente.nombre">

      <select [(ngModel)]="nuevoExpediente.estado">
        <option value="">Seleccione un estado</option>
        <option value="Pendiente">Pendiente</option>
        <option value="En proceso">En proceso</option>
        <option value="Finalizado">Finalizado</option>
      </select>

      <input type="date" [(ngModel)]="nuevoExpediente.fechaCreacion">

      <select [(ngModel)]="nuevoExpediente.prioridad">
        <option value="">Seleccione prioridad</option>
        <option value="baja">Baja</option>
        <option value="media">Media</option>
        <option value="alta">Alta</option>
      </select>

      <button class="boton primary" (click)="agregarExpediente()">

        @if(editandoId){
          Guardar Cambios
        } @else {
          + Agregar Expediente
        }

      </button>

    </div>
  </div>

  <div class="card tabla-wrapper">
    <table class="tabla">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Estado</th>
          <th>Fecha</th>
          <th>Prioridad</th>
          <th>Acción</th>
        </tr>
      </thead>

      <tbody>
        @for (expediente of expedientes; track expediente.id) {
          <tr>
            <td>#{{ expediente.id }}</td>
            <td class="nombre">{{ expediente.nombre }}</td>
            <td>
              <span class="estado {{ expediente.estado.toLowerCase().replace(' ', '-') }}">
                {{ expediente.estado }}
              </span>
            </td>
            <td>{{ expediente.fechaCreacion }}</td>
            <td>
              <span class="prioridad {{ expediente.prioridad.toLowerCase() }}">
                {{ expediente.prioridad }}
              </span>
            </td>
            <td class="acciones">

              <button class="boton editar"
                (click)="editarExpediente(expediente)">
                Editar
              </button>

              <button class="boton danger"
                (click)="eliminarExpediente(expediente.id)">
                Eliminar
              </button>

              <button class="boton detalle" [routerLink]="['/expedientes', expediente.id]">
                  Ver Detalle
              </button>

              <button class="boton estado"
                (click)="cambiarEstado(expediente)">
                Cambiar Estado
              </button>

            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
