<div class="contenedor">

  <h1>✏️ Editar Expediente</h1>

  @if(expediente){

    <div class="card formulario-grid">

      <!-- Nombre -->

      <div class="campo-formulario">

        <label>📁 Nombre del expediente</label>

        <input
          type="text"
          placeholder="Ingrese nombre"
          [(ngModel)]="expediente.nombre"
          [class.input-error]="!expediente.nombre">

      </div>

      <!-- Estado -->

      <div class="campo-formulario">

        <label>📌 Estado</label>

        <select
          [(ngModel)]="expediente.estado"
          [class.input-error]="!expediente.estado">

          <option value="">Seleccione estado</option>

          <option value="Pendiente">Pendiente</option>

          <option value="En proceso">En proceso</option>

          <option value="Finalizado">Finalizado</option>

        </select>

      </div>

      <!-- Fecha creación -->

      <div class="campo-formulario">

        <label>📅 Fecha creación</label>

        <input
          type="date"
          [(ngModel)]="expediente.fechaCreacion"
          [class.input-error]="!expediente.fechaCreacion">

      </div>

      <!-- Fecha vencimiento -->

      <div class="campo-formulario">

        <label>⏰ Fecha vencimiento</label>

        <input
          type="date"
          [(ngModel)]="expediente.fechaVencimiento"
          [min]="expediente.fechaCreacion">

      </div>

      <!-- Prioridad -->

      <div class="campo-formulario">

        <label>🚨 Prioridad</label>

        <select
          [(ngModel)]="expediente.prioridad"
          [class.input-error]="!expediente.prioridad">

          <option value="">Seleccione prioridad</option>

          <option value="alta">Alta</option>

          <option value="media">Media</option>

          <option value="baja">Baja</option>

        </select>

      </div>

      <!-- Observaciones -->

      <div class="observaciones-container">

        <label>📝 Observaciones</label>

        <div class="observaciones-box">

          <input
            type="text"
            placeholder="Nueva observación"
            [(ngModel)]="nuevaObservacion">

          <button
            type="button"
            class="boton detalle"
            (click)="agregarObservacion()">

            ➕ Observación

          </button>

        </div>

        <ul class="lista-observaciones">

          @for(observacion of expediente.observaciones;
            track observacion){

            <li>

              <input
                type="text"
                [(ngModel)]="expediente.observaciones[$index]">

              <button
                type="button"
                class="boton danger mini"
                (click)="eliminarObservacion($index)">

                ❌

              </button>

            </li>

          }

        </ul>

      </div>

      <!-- Guardar -->

      <button
        class="boton primary"
        (click)="guardarCambios()">

        💾 Guardar Cambios

      </button>

    </div>

  }

</div>
